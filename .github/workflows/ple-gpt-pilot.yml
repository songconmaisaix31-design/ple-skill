name: PLE cloud model pilot

on:
  push:
    branches: [codex/ple-gpt-cloud-pilot]

permissions:
  contents: read

concurrency:
  group: ple-gpt-cloud-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the declared model with the official kit
        shell: bash
        run: |
          docker version >/dev/null
          python3 -m venv "$RUNNER_TEMP/ple-bootstrap"
          "$RUNNER_TEMP/ple-bootstrap/bin/python" -m pip install --disable-pip-version-check uv
          echo "$RUNNER_TEMP/ple-bootstrap/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ple-bootstrap/bin:$PATH"
          kit="$RUNNER_TEMP/ple-official"
          git init -q "$kit"
          git -C "$kit" fetch --depth 1 https://github.com/google-research/ple.git 8320f0402fdca9f42476607f72bcfd5271cd50c9
          git -C "$kit" checkout -q --detach FETCH_HEAD
          cd "$kit"
          uv sync
          uv run python -m kit validate "$GITHUB_WORKSPACE"
          uv run python - "$GITHUB_WORKSPACE/submission.yaml" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          entry = yaml.safe_load(Path(sys.argv[1]).read_text())
          if entry["model_api"] != "google-cloud/glm-5.2":
              raise SystemExit("This repository must declare the eligible GLM-5.2 model.")
          PY

      - name: Select and verify the configured cloud model
        id: model_selection
        if: ${{ github.event.head_commit.message == 'Start authorized cloud model pilot' }}
        shell: bash
        env:
          PLE_OPENAI_API_KEY: ${{ secrets.PLE_OPENAI_API_KEY }}
          PLE_HF_INFERENCE_TOKEN: ${{ secrets.PLE_HF_INFERENCE_TOKEN || secrets.PLE_HF_TOKEN }}
        run: |
          python="$RUNNER_TEMP/ple-official/.venv/bin/python"
          if [[ -n "$PLE_OPENAI_API_KEY" ]] && \
             MODEL_API=openai/gpt-6.1-sol MODEL_NAME=gpt-6.1-sol \
             MODEL_BASE_URL=https://api.openai.com/v1 MODEL_API_KEY="$PLE_OPENAI_API_KEY" \
             "$python" -m devtools.cloud_model_probe; then
            echo 'model_api=openai/gpt-6.1-sol' >> "$GITHUB_OUTPUT"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$PLE_HF_INFERENCE_TOKEN" ]]; then
            echo 'Pilot waiting for a usable OpenAI API key or Hugging Face inference token.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          umask 077
          export MODEL_PROXY_URL=http://127.0.0.1:4101
          MODEL_PROXY_KEY=$(openssl rand -hex 24)
          export MODEL_PROXY_KEY
          printf '::add-mask::%s\n' "$MODEL_PROXY_KEY"
          printf 'MODEL_PROXY_URL=%s\nMODEL_PROXY_KEY=%s\n' "$MODEL_PROXY_URL" "$MODEL_PROXY_KEY" >> "$GITHUB_ENV"
          env -u PLE_OPENAI_API_KEY nohup python3 devtools/gpt_cloud_relay.py \
            </dev/null >"$RUNNER_TEMP/ple-relay.log" 2>&1 &
          curl --max-time 5 --fail --silent --retry 8 --retry-connrefused --retry-delay 1 "$MODEL_PROXY_URL/ready" >/dev/null
          MODEL_API=google-cloud/glm-5.2 MODEL_NAME=glm-5.2 \
            MODEL_BASE_URL="$MODEL_PROXY_URL/v1" MODEL_API_KEY="$MODEL_PROXY_KEY" \
            "$python" -m devtools.cloud_model_probe
          echo 'model_api=google-cloud/glm-5.2' >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Validate the selected evaluation entry
        if: steps.model_selection.outputs.ready == 'true'
        shell: bash
        env:
          PLE_MODEL_API: ${{ steps.model_selection.outputs.model_api }}
        run: |
          entry="$GITHUB_WORKSPACE"
          case "$PLE_MODEL_API" in
            openai/gpt-6.1-sol)
              entry="$RUNNER_TEMP/ple-sol-entry"
              git clone --quiet "$GITHUB_WORKSPACE" "$entry"
              sed -i 's@^model_api: google-cloud/glm-5[.]2$@model_api: openai/gpt-6.1-sol@' "$entry/submission.yaml"
              git -C "$entry" add submission.yaml
              git -C "$entry" -c user.name='PLE Cloud Pilot' -c user.email='pilot@users.noreply.github.com' \
                commit --quiet -m 'Use GPT-6.1 Sol for this development run'
              ;;
            google-cloud/glm-5.2) ;;
            *) echo 'Unexpected pilot model.'; exit 1 ;;
          esac
          printf 'PLE_EVAL_ENTRY=%s\nPLE_EVAL_MODEL_API=%s\n' "$entry" "$PLE_MODEL_API" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/ple-official"
          uv run python -m kit validate "$entry"

      - name: Prepare Hugging Face device authorization for this runner
        id: hf_device
        if: ${{ steps.model_selection.outputs.ready == 'true' && github.event.head_commit.message == 'Start authorized cloud model pilot' }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.PLE_HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then exit 0; fi
          umask 077
          export HF_HOME="$RUNNER_TEMP/ple-hf-home"
          printf 'HF_HOME=%s\n' "$HF_HOME" >> "$GITHUB_ENV"
          state="$RUNNER_TEMP/ple-hf-auth"
          nohup python3 devtools/hf_cloud_device.py \
            --hf "$RUNNER_TEMP/ple-official/.venv/bin/hf" --state "$state" \
            --public-key devtools/hf_cloud_session_public.pem \
            </dev/null >"$RUNNER_TEMP/ple-hf-device.log" 2>&1 &
          for _ in {1..25}; do
            if [[ -s "$state/challenge.bin" || -f "$state/status" ]]; then break; fi
            sleep 1
          done
          if [[ ! -s "$state/challenge.bin" ]]; then
            echo 'Hugging Face CLI did not start device authorization.'
            exit 1
          fi
          echo 'started=true' >> "$GITHUB_OUTPUT"

      - name: Make the encrypted device challenge available
        if: steps.hf_device.outputs.started == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ple-hf-device-challenge
          path: ${{ runner.temp }}/ple-hf-auth/challenge.bin
          if-no-files-found: error
          retention-days: 1

      - name: Wait for the selected Hugging Face account
        if: steps.hf_device.outputs.started == 'true'
        shell: bash
        run: |
          state="$RUNNER_TEMP/ple-hf-auth/status"
          for _ in {1..64}; do
            if [[ -s "$state" ]]; then break; fi
            sleep 5
          done
          if [[ ! -s "$state" || "$(cat "$state")" != authenticated ]]; then
            echo 'Hugging Face device authorization did not complete.'
            exit 1
          fi

      - name: Verify access to the official PLE dataset
        id: dataset_access
        if: steps.model_selection.outputs.ready == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.PLE_HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          if [[ -z "$HF_TOKEN" && ( -z "${HF_HOME:-}" || ! -s "$HF_HOME/token" ) ]]; then
            echo 'Official dev task not run. Awaiting Hugging Face dataset access.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cd "$RUNNER_TEMP/ple-official"
          uv run python - <<'PY'
          import time

          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          api = HfApi()
          for attempt in range(21):
              try:
                  api.auth_check("google/physical-engineerings-last-exam", repo_type="dataset")
              except HfHubHTTPError as exc:
                  status = getattr(exc.response, "status_code", None)
                  if status != 403 or attempt == 20:
                      raise SystemExit(f"Hugging Face dataset permission check failed (HTTP {status}).") from None
                  if attempt == 0:
                      print("Hugging Face login succeeded. Waiting for the separate PLE dataset grant (HTTP 403).", flush=True)
                  time.sleep(15)
              except Exception:
                  raise SystemExit("Hugging Face dataset permission check could not complete.") from None
              else:
                  break
          print("Hugging Face dataset access verified.")
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Run and score one official checks-only task
        if: steps.dataset_access.outputs.ready == 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.PLE_HF_TOKEN }}
          OPENAI_API_KEY: ${{ steps.model_selection.outputs.model_api == 'openai/gpt-6.1-sol' && secrets.PLE_OPENAI_API_KEY || '' }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          cd "$RUNNER_TEMP/ple-official"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/ple-bin"
          mkdir -p "$UV_TOOL_BIN_DIR"
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          env -u HF_TOKEN uv tool install harbor==0.20.0 --with websockets
          out="$RUNNER_TEMP/ple-pilot"
          log="$RUNNER_TEMP/ple-pilot.log"
          status=0
          uv run python eval/run.py "$PLE_EVAL_ENTRY" --tasks wind-diaphragm-shear \
            --trials 1 --attempts 1 --no-export --out "$out" >"$log" 2>&1 || status=$?

          python3 - "$out/results.json" "$log" "$status" "$PLE_EVAL_MODEL_API" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import math
          import sys
          from pathlib import Path

          result_path, log_path, exit_status, expected_model = sys.argv[1:]
          if not Path(result_path).is_file():
              log = Path(log_path).read_text(errors="replace").lower()
              if "no space left" in log:
                  issue = "runner disk exhausted"
              elif "docker failed" in log or "docker daemon" in log:
                  issue = "Docker setup failed"
              elif "401 client error" in log or "403 client error" in log or "gated repo" in log:
                  issue = "dataset download was refused"
              else:
                  issue = "official evaluator stopped before writing results"
              print(f"wind-diaphragm-shear: unmeasured ({issue}; exit {exit_status}).")
              raise SystemExit(1)
          result = json.loads(Path(result_path).read_text())
          if result.get("model") != expected_model:
              raise SystemExit("Evaluation report has an unexpected model ID.")
          task = next((row for row in result["tasks"] if row["id"] == "wind-diaphragm-shear"), None)
          if not task or not task.get("measured"):
              print("wind-diaphragm-shear: official evaluator did not measure a score.")
              raise SystemExit(1)
          score = float(task["score"])
          if not math.isfinite(score) or not 0 <= score <= 1:
              raise SystemExit("Evaluation report has an invalid score.")
          print(f"wind-diaphragm-shear: measured, normalized score {score:.6f} / 1.000000.")
          if exit_status != "0":
              print(f"Official evaluator exited {exit_status} after recording the score.")
              raise SystemExit(1)
          PY
