name: PLE submission export
on:
  push:
    branches: [codex/ple-official-export]
  workflow_dispatch:
    inputs:
      pilot_run:
        description: "For the remaining 28 tasks, provide the verified pilot run ID. Leave empty for a single pilot."
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  PLE_ENTRY_SOURCE_SHA: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run official PLE export single data-hall-mep-routing' && '35306a8edc3e053a6b67a8e8701ad2caeb168e08' || github.sha }}
concurrency:
  group: ple-official-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hosted-gemma-probe:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Probe hosted PLE Gemma'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - id: trigger
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" == 'Probe hosted PLE Gemma' ]]; then echo 'exact=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.trigger.outputs.exact == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify one hosted Gemma tool call
        if: steps.trigger.outputs.exact == 'true'
        env:
          PLE_GEMINI_API_KEY: ${{ secrets.PLE_GEMINI_API_KEY }}
        run: python3 devtools/google_gemma_probe.py > "$RUNNER_TEMP/hosted-gemma-probe.json"
      - if: always() && steps.trigger.outputs.exact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-gemma-probe-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-gemma-probe.json
          if-no-files-found: error
          retention-days: 30
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run official PLE export pilot' || github.event.head_commit.message == 'Run official PLE export single data-hall-mep-routing' || startsWith(github.event.head_commit.message, 'Run official PLE export cohort ')
    runs-on: ubuntu-24.04
    outputs:
      remaining: ${{ steps.tasks.outputs.remaining }}
      prior: ${{ steps.mode.outputs.prior }}
      single: ${{ steps.mode.outputs.single }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - id: mode
        env:
          TITLE: ${{ github.event.head_commit.message }}
          PRIOR: ${{ inputs.pilot_run }}
        shell: bash
        run: |
          single=wind-diaphragm-shear
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            case "$TITLE" in
              'Run official PLE export pilot') ;;
              'Run official PLE export single data-hall-mep-routing') single=data-hall-mep-routing ;;
              'Run official PLE export cohort '*)
                PRIOR=${TITLE#Run official PLE export cohort }
                [[ -n "$PRIOR" ]] ;;
              *) exit 1 ;;
            esac
          fi
          [[ -z "$PRIOR" || "$PRIOR" =~ ^[1-9][0-9]+$ ]]
          if [[ -n "$PRIOR" ]]; then single=''; fi
          echo "single=$single" >> "$GITHUB_OUTPUT"
          echo "prior=$PRIOR" >> "$GITHUB_OUTPUT"
      - run: bash devtools/official_entry.sh
      - if: steps.mode.outputs.prior != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.mode.outputs.prior }}
          pattern: ple-export-wind-diaphragm-shear-attempt-*
          path: ${{ runner.temp }}/shards
      - if: steps.mode.outputs.prior != ''
        env:
          PILOT_RUN: ${{ steps.mode.outputs.prior }}
        run: '"$RUNNER_TEMP/ple-kit/.venv/bin/python" devtools/official_export.py validate-pilot'
      - id: tasks
        run: '"$RUNNER_TEMP/ple-kit/.venv/bin/python" devtools/official_export.py plan'
  pilot:
    needs: plan
    if: needs.plan.outputs.prior == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/official-task
        with:
          task: ${{ needs.plan.outputs.single }}
          hf-token: ${{ secrets.PLE_HF_TOKEN }}
  cohort:
    needs: plan
    if: needs.plan.outputs.prior != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.remaining) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./.github/actions/official-task
        with:
          task: ${{ matrix.task }}
          hf-token: ${{ secrets.PLE_HF_TOKEN }}
  package:
    needs: [plan, pilot, cohort]
    if: always() && needs.plan.result == 'success' && (needs.pilot.result == 'success' || (needs.plan.outputs.prior != '' && !cancelled()))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PILOT_RUN: ${{ needs.plan.outputs.prior }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - run: bash devtools/official_entry.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ple-export-${{ needs.plan.outputs.single || '*' }}-attempt-*
          path: ${{ runner.temp }}/shards
      - if: env.PILOT_RUN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.PILOT_RUN }}
          pattern: ple-export-wind-diaphragm-shear-attempt-*
          path: ${{ runner.temp }}/shards
      - run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ple-kit/.venv/bin/python"
          "$python" devtools/official_export.py assemble
          entry="$RUNNER_TEMP/ple-entry"
          git -C "$entry" add artifacts
          git -C "$entry" -c user.name='PLE evaluation' -c user.email='ple@localhost' commit -qm 'Attach reviewed official task artifacts'
          source devtools/official_model.sh
          cd "$RUNNER_TEMP/ple-kit"
          "$python" -m kit check "$entry" --cancel-test --work "$RUNNER_TEMP/ple-check"
          "$python" -c 'import json,sys; sys.exit(json.load(open(sys.argv[1]))["ready"] is not True)' "$RUNNER_TEMP/ple-check/check.json"
          cp "$RUNNER_TEMP/ple-check/check.json" "$RUNNER_TEMP/evidence/kit-check.json"
          "$python" "$GITHUB_WORKSPACE/devtools/pack_verified_entry.py" "$entry" "$RUNNER_TEMP/evidence"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ple-official-package-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30
