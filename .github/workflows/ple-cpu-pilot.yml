name: PLE CPU model pilot

on:
  push:
    branches: [codex/ple-cpu-cloud-pilot]
  workflow_dispatch:
    inputs:
      model:
        description: Model to test
        type: choice
        options: [auto, gemma26, granite]
        default: auto

permissions:
  contents: read

jobs:
  cpu-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.head_commit.message == 'Run actionable feedback replay on P and Q' && '["p","q"]' || github.event.head_commit.message == 'Run native feedback replay on N and O' && '["n","o"]' || github.event.head_commit.message == 'Run native patch replay on L and M' && '["l","m"]' || github.event.head_commit.message == 'Run constrained patch replay on J and K' && '["j","k"]' || github.event.head_commit.message == 'Run controlled repair replay on H and I' && '["h","i"]' || github.event.head_commit.message == 'Test source context in a fixed-seed repair ablation' && '["f","g"]' || github.event.head_commit.message == 'Replicate the first Python action with a fixed seed' && '["d","e"]' || startsWith(github.event.head_commit.message, 'Compare Python action strategies on cloud CPU') && '["a","b","c"]' || github.event.head_commit.message == 'Evaluate original storage designs on cloud CPU' && '["a","b"]' || '["a"]') }}
        strategy: ${{ fromJSON((github.event.head_commit.message == 'Run actionable feedback replay on P and Q' || github.event.head_commit.message == 'Run native feedback replay on N and O' || github.event.head_commit.message == 'Run native patch replay on L and M' || github.event.head_commit.message == 'Run constrained patch replay on J and K' || github.event.head_commit.message == 'Run controlled repair replay on H and I' || github.event.head_commit.message == 'Replicate the first Python action with a fixed seed' || github.event.head_commit.message == 'Test source context in a fixed-seed repair ablation') && '["paired"]' || startsWith(github.event.head_commit.message, 'Compare Python action strategies on cloud CPU') && '["legacy","native","text"]' || '["legacy"]') }}
        repeat: ${{ fromJSON((github.event.head_commit.message == 'Run actionable feedback replay on P and Q' || github.event.head_commit.message == 'Run native feedback replay on N and O' || github.event.head_commit.message == 'Run native patch replay on L and M' || github.event.head_commit.message == 'Run constrained patch replay on J and K' || github.event.head_commit.message == 'Run controlled repair replay on H and I' || github.event.head_commit.message == 'Replicate the first Python action with a fixed seed' || github.event.head_commit.message == 'Test source context in a fixed-seed repair ablation') && '[1,2,3]' || '[1]') }}
    env:
      DESIGN_BENCH: ${{ github.event.head_commit.message == 'Evaluate original storage designs on cloud CPU' || startsWith(github.event.head_commit.message, 'Compare Python action strategies on cloud CPU') }}
      VERIFY_MCP: ${{ startsWith(github.event.head_commit.message, 'Check PLE tool transport on the cloud CPU') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PLE validation kit
        shell: bash
        run: |
          docker version >/dev/null
          python3 -m venv "$RUNNER_TEMP/ple-bootstrap"
          "$RUNNER_TEMP/ple-bootstrap/bin/python" -m pip install --disable-pip-version-check uv
          echo "$RUNNER_TEMP/ple-bootstrap/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ple-bootstrap/bin:$PATH"
          kit="$RUNNER_TEMP/ple-official"
          git init -q "$kit"
          git -C "$kit" fetch --depth 1 https://github.com/google-research/ple.git 8320f0402fdca9f42476607f72bcfd5271cd50c9
          git -C "$kit" checkout -q --detach FETCH_HEAD
          cd "$kit"
          uv sync

      - name: Verify isolated execution and exact file exports
        if: env.DESIGN_BENCH == 'true' || matrix.strategy == 'paired'
        shell: bash
        run: |
          docker pull --platform linux/amd64 'python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b'
          "$RUNNER_TEMP/ple-official/.venv/bin/python" devtools/run_design_regression.py \
            --kit-root "$RUNNER_TEMP/ple-official" --check-transport | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the controlled repair fixture and wrapper
        if: ${{ matrix.strategy == 'paired' && (matrix.variant == 'h' || matrix.variant == 'i' || matrix.variant == 'j' || matrix.variant == 'k' || matrix.variant == 'l' || matrix.variant == 'm' || matrix.variant == 'n' || matrix.variant == 'o' || matrix.variant == 'p' || matrix.variant == 'q') }}
        shell: bash
        run: |
          protocol=docs/experiments/controlled-repair-replay-v1/protocol.json
          if [[ "${{ matrix.variant }}" == j || "${{ matrix.variant }}" == k ]]; then
            protocol=docs/experiments/constrained-patch-v1/protocol.json
          fi
          if [[ "${{ matrix.variant }}" == l || "${{ matrix.variant }}" == m ]]; then
            protocol=docs/experiments/native-patch-v1/protocol.json
          fi
          if [[ "${{ matrix.variant }}" == n || "${{ matrix.variant }}" == o ]]; then
            protocol=docs/experiments/native-feedback-v1/protocol.json
          fi
          if [[ "${{ matrix.variant }}" == p || "${{ matrix.variant }}" == q ]]; then
            protocol=docs/experiments/actionable-feedback-v1/protocol.json
          fi
          PYTHONPATH=devtools "$RUNNER_TEMP/ple-official/.venv/bin/python" devtools/verify_repair_fixture.py \
            --protocol "$protocol" \
            --prior-evidence docs/experiments/paired-storage-v1/evidence.zip
          "$RUNNER_TEMP/ple-official/.venv/bin/python" devtools/test_controlled_replay.py

      - name: Start the account-free CPU model and verify a real synthetic tool call
        if: matrix.strategy != 'paired'
        shell: bash
        env:
          PLE_CPU_EVAL_GREEDY: ${{ env.DESIGN_BENCH }}
          PROFILE: ${{ (startsWith(github.event.head_commit.message, 'Compare Python action strategies on cloud CPU') && 'gemma26') || inputs.model || (github.event.head_commit.message == 'Test Granite on the cloud CPU' && 'granite') || 'auto' }}
        run: |
          umask 077
          export MODEL_PROXY_URL=http://127.0.0.1:4102
          export MODEL_BASE_URL="$MODEL_PROXY_URL/v1"
          export PLE_CPU_STATE="$RUNNER_TEMP/ple-cpu"
          MODEL_PROXY_KEY=$(openssl rand -hex 24)
          export MODEL_PROXY_KEY
          printf '::add-mask::%s\n' "$MODEL_PROXY_KEY"
          export MODEL_API_KEY="$MODEL_PROXY_KEY"
          python="$RUNNER_TEMP/ple-official/.venv/bin/python"
          case "$PROFILE" in
            auto) profiles=(gemma26 granite) ;;
            gemma26|granite) profiles=("$PROFILE") ;;
            *) exit 1 ;;
          esac
          for profile in "${profiles[@]}"; do
            if bash devtools/start_cpu_model.sh "$profile"; then
              source "$PLE_CPU_STATE/model.env"
              if MODEL_API="$PLE_CPU_MODEL_API" MODEL_NAME="$PLE_CPU_MODEL_NAME" "$python" -m devtools.cloud_model_probe; then
                printf 'MODEL_PROXY_URL=%s\nMODEL_BASE_URL=%s\nMODEL_PROXY_KEY=%s\nMODEL_API_KEY=%s\nPLE_CPU_STATE=%s\n' \
                  "$MODEL_PROXY_URL" "$MODEL_BASE_URL" "$MODEL_PROXY_KEY" "$MODEL_API_KEY" "$PLE_CPU_STATE" >> "$GITHUB_ENV"
                cat "$PLE_CPU_STATE/model.env" >> "$GITHUB_ENV"
                printf '%s completed a native synthetic tool call on the cloud runner.\n' "$PLE_CPU_MODEL_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              kill "$(cat "$PLE_CPU_STATE/server.pid")" 2>/dev/null || true
              for _ in {1..10}; do
                if ! curl --max-time 1 --silent "$MODEL_PROXY_URL/health" >/dev/null; then break; fi
                sleep 1
              done
            fi
            if [[ "$profile" == gemma26 ]]; then
              rm -f "$PLE_CPU_STATE/gemma-4-26B-A4B-it-UD-IQ2_XXS.gguf"
            fi
          done
          echo 'No local CPU model produced the required tool call.' >&2
          exit 1

      - name: Score the independent classroom mechanics diagnostic
        if: env.VERIFY_MCP != 'true' && env.DESIGN_BENCH != 'true' && matrix.strategy != 'paired'
        continue-on-error: true
        shell: bash
        run: |
          image='python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b'
          docker pull --platform linux/amd64 "$image"
          MODEL_API="$PLE_CPU_MODEL_API" MODEL_NAME="$PLE_CPU_MODEL_NAME" \
            "$RUNNER_TEMP/ple-official/.venv/bin/python" devtools/engineering_regression.py \
            --timeout-sec 840 --checkpoint-sec 395 --docker-image "$image" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Evaluate an original storage schedule with isolated scoring
        if: env.DESIGN_BENCH == 'true'
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          PLE_CODE_ACTION: ${{ matrix.strategy }}
          CHECKPOINT_ONLY: ${{ github.event.head_commit.message == 'Compare Python action strategies on cloud CPU at 395 seconds' }}
        run: |
          timing=()
          if [[ "$CHECKPOINT_ONLY" == true ]]; then timing=(--checkpoint-only-sec 395); fi
          MODEL_API="$PLE_CPU_MODEL_API" MODEL_NAME="$PLE_CPU_MODEL_NAME" \
            "$RUNNER_TEMP/ple-official/.venv/bin/python" devtools/run_design_regression.py \
            --kit-root "$RUNNER_TEMP/ple-official" --variant "$VARIANT" --timeout-sec 720 "${timing[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Replicate both action modes on the same CPU
        if: matrix.strategy == 'paired'
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          REPEAT: ${{ matrix.repeat }}
          PLE_CPU_EVAL_GREEDY: 'true'
        run: |
          umask 077
          export MODEL_PROXY_URL=http://127.0.0.1:4102
          export MODEL_BASE_URL="$MODEL_PROXY_URL/v1"
          export PLE_CPU_STATE="$RUNNER_TEMP/ple-cpu"
          MODEL_PROXY_KEY=$(openssl rand -hex 24)
          export MODEL_PROXY_KEY
          export MODEL_API_KEY="$MODEL_PROXY_KEY"
          printf '::add-mask::%s\n' "$MODEL_PROXY_KEY"
          kit="$RUNNER_TEMP/ple-official"
          python="$kit/.venv/bin/python"
          private="$RUNNER_TEMP/ple-replication-private"
          public="$RUNNER_TEMP/ple-replication"
          mkdir -p "$private" "$public"
          case "$VARIANT:$REPEAT" in
            d:1|e:2|d:3) arms=(legacy text) ;;
            e:1|d:2|e:3) arms=(text legacy) ;;
            f:1|g:2|f:3) arms=(text text-source) ;;
            g:1|f:2|g:3) arms=(text-source text) ;;
            h:1|i:2|h:3) arms=(text text-source) ;;
            i:1|h:2|i:3) arms=(text-source text) ;;
            j:1|k:2|j:3) arms=(text-source patch-source) ;;
            k:1|j:2|k:3) arms=(patch-source text-source) ;;
            l:1|m:2|l:3) arms=(patch-source native-patch) ;;
            m:1|l:2|m:3) arms=(native-patch patch-source) ;;
            n:1|o:2|n:3) arms=(native-patch native-feedback) ;;
            o:1|n:2|o:3) arms=(native-feedback native-patch) ;;
            p:1|q:2|p:3) arms=(native-feedback native-actionable) ;;
            q:1|p:2|q:3) arms=(native-actionable native-feedback) ;;
            *) echo 'Unexpected replication pair.' >&2; exit 1 ;;
          esac

          stop_server() {
            local pid state
            [[ -s "$PLE_CPU_STATE/server.pid" ]] || return 0
            read -r pid < "$PLE_CPU_STATE/server.pid"
            [[ "$pid" =~ ^[0-9]+$ && "$pid" -gt 1 ]] || return 1
            kill "$pid" 2>/dev/null || true
            for _ in {1..15}; do
              state=$(ps -o stat= -p "$pid" || true)
              if [[ -z "$state" || "$state" == Z* ]]; then
                rm -f "$PLE_CPU_STATE/server.pid"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          overall=0
          position=0
          controlled=()
          if [[ "$VARIANT" == h || "$VARIANT" == i || "$VARIANT" == j || "$VARIANT" == k || "$VARIANT" == l || "$VARIANT" == m || "$VARIANT" == n || "$VARIANT" == o || "$VARIANT" == p || "$VARIANT" == q ]]; then
            controlled=(--controlled-first-program)
          fi
          for arm in "${arms[@]}"; do
            position=$((position + 1))
            action_mode="$arm"
            unset PLE_REPAIR_CONTEXT
            patch=()
            native_patch=()
            native_feedback=()
            native_actionable=()
            if [[ "$arm" == text-source || "$arm" == patch-source || "$arm" == native-patch || "$arm" == native-feedback || "$arm" == native-actionable ]]; then
              action_mode=text
              export PLE_REPAIR_CONTEXT=source
            fi
            if [[ "$arm" == patch-source ]]; then
              patch=(--controlled-patch-repair)
            fi
            if [[ "$arm" == native-patch ]]; then
              native_patch=(--controlled-native-patch)
            fi
            if [[ "$arm" == native-feedback ]]; then
              native_feedback=(--controlled-native-feedback)
            fi
            if [[ "$arm" == native-actionable ]]; then
              native_actionable=(--controlled-native-actionable)
            fi
            raw="$private/$arm"
            evidence="$public/$arm"
            mkdir -p "$raw" "$evidence"
            phase=server_restart
            status=1
            if stop_server; then
              rm -f "$PLE_CPU_STATE/server.log"
              phase=model_start
              if bash devtools/start_cpu_model.sh gemma26 > "$raw/startup.log" 2>&1; then
                source "$PLE_CPU_STATE/model.env"
                if [[ "$PLE_CPU_MODEL_NAME" == gemma-4-26b && "$PLE_CPU_MODEL_API" == google-cloud/gemma-4-26b ]]; then
                  export MODEL_API="$PLE_CPU_MODEL_API" MODEL_NAME="$PLE_CPU_MODEL_NAME"
                  phase=model_probe
                  if "$python" -m devtools.cloud_model_probe > "$raw/probe.log" 2>&1; then
                    phase=experiment
                    status=0
                    PLE_CODE_ACTION="$action_mode" "$python" devtools/run_design_regression.py \
                      --kit-root "$kit" --variant "$VARIANT" --timeout-sec 720 --checkpoint-only-sec 395 \
                      "${controlled[@]}" "${patch[@]}" "${native_patch[@]}" "${native_feedback[@]}" "${native_actionable[@]}" \
                      --keep-dir "$raw/case" --archive-model-io "$raw/model-io.jsonl" \
                      > "$raw/experiment.log" 2>&1 || status=$?
                  fi
                fi
              fi
              if ! stop_server; then
                echo 'The previous model process did not exit.' >&2
                overall=1
              fi
              if [[ -f "$PLE_CPU_STATE/server.log" ]]; then cp "$PLE_CPU_STATE/server.log" "$raw/server.log"; fi
            fi
            "$python" devtools/record_paired_arm.py "$raw" "$evidence" "$arm" "$position" "${arms[0]}" "$phase" "$status" || overall=1
          done
          exit "$overall"

      - name: Upload the paired replication evidence
        if: ${{ always() && matrix.strategy == 'paired' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ple-replication-${{ matrix.variant }}-${{ matrix.repeat }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ple-replication/*/metadata.json
            ${{ runner.temp }}/ple-replication/*/report.json
            ${{ runner.temp }}/ple-replication/*/startup.log
            ${{ runner.temp }}/ple-replication/*/probe.log
            ${{ runner.temp }}/ple-replication/*/server.log
            ${{ runner.temp }}/ple-replication/*/experiment.log
            ${{ runner.temp }}/ple-replication/*/model-io.jsonl
            ${{ runner.temp }}/ple-replication/*/case/task.md
            ${{ runner.temp }}/ple-replication/*/case/input/site.json
            ${{ runner.temp }}/ple-replication/*/case/input/periods.csv
            ${{ runner.temp }}/ple-replication/*/case/output/schedule.csv
            ${{ runner.temp }}/ple-replication/*/case/output/summary.json
          if-no-files-found: warn

      - name: Run the official kit synthetic tasks using the real CPU model
        if: env.DESIGN_BENCH != 'true' && matrix.strategy != 'paired'
        shell: bash
        run: |
          entry="$RUNNER_TEMP/ple-cpu-entry"
          git clone --quiet "$GITHUB_WORKSPACE" "$entry"
          sed -i "s@^model_api: .*@model_api: $PLE_CPU_MODEL_API@" "$entry/submission.yaml"
          args=()
          if [[ "$PLE_CPU_MODEL_API" == openai-compatible/* ]]; then
            printf '\nmodel_base_url: https://llm.example.org/v1\n' >> "$entry/submission.yaml"
            args=(--model-base-url "$MODEL_BASE_URL")
          fi
          git -C "$entry" add submission.yaml
          git -C "$entry" -c user.name='PLE Cloud Pilot' -c user.email='pilot@users.noreply.github.com' \
            commit --quiet -m 'Select the CPU model for this development test'
          cd "$RUNNER_TEMP/ple-official"
          uv run python -m kit validate "$entry"
          status=0
          work="$RUNNER_TEMP/ple-kit-cpu"
          trials=1
          if [[ "$VERIFY_MCP" == true ]]; then trials=2; fi
          for ((i=1; i<=trials; i++)); do
            rm -f "$work/check.json"
            uv run python -m kit check "$entry" --work "$work" "${args[@]}" || status=$?
            python3 - "$work/check.json" "$i" "$VERIFY_MCP" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          import json
          from pathlib import Path
          import sys

          try:
              report = json.loads(Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              report = {}
          results = {row["name"]: row["status"] for row in report.get("stages", [])}
          print(f"Official kit synthetic test stages, trial {sys.argv[2]}")
          for stage in ("build", "model", "listen", "smoke", "mcp"):
              print(f"- {stage}: {results.get(stage, 'not run')}")
          if sys.argv[3] == "true" and any(results.get(s) != "pass" for s in ("smoke", "mcp")):
              sys.exit(1)
          PY
          done
          exit "$status"

      - name: Stop the transient model server
        if: ${{ always() }}
        shell: bash
        run: |
          pid="$RUNNER_TEMP/ple-cpu/server.pid"
          if [[ -s "$pid" ]]; then kill "$(cat "$pid")" 2>/dev/null || true; fi

